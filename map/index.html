<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Train Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #0d0f14;
      --surface:    #14171f;
      --border:     rgba(255,255,255,0.07);
      --text-primary:#f0f2f7;
      --text-muted: #6b7385;
      --text-dim:   #3d4356;
      --tfl-blue:   #003087;
      --tfl-red:    #e21836;
      --font-main:  'DM Sans', system-ui, sans-serif;
      --font-mono:  'DM Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text-primary); font-family: var(--font-main); }

    .header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; gap: 12px;
      height: 52px; padding: 0 16px;
      background: rgba(13,15,20,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .roundel { position: relative; flex-shrink: 0; width: 30px; height: 30px; }
    .roundel-ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--tfl-blue); }
    .roundel-bar  { position: absolute; top: 50%; left: -2px; right: -2px; height: 8px; transform: translateY(-50%); background: var(--tfl-red); z-index: 1; }
    .htext h1 { font-size: 0.95rem; font-weight: 700; line-height: 1.1; }
    .htext p  { font-size: 0.63rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .spacer { flex: 1; }
    #status-text { font-family: var(--font-mono); font-size: 0.63rem; color: var(--text-dim); white-space: nowrap; }
    .back-link {
      font-size: 0.73rem; color: var(--text-muted); text-decoration: none;
      padding: 5px 11px; border: 1px solid var(--border); border-radius: 6px;
      transition: color .15s, border-color .15s; white-space: nowrap;
    }
    .back-link:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.2); }

    #map-canvas {
      position: absolute; top: 52px; left: 0; right: 0; bottom: 0;
      width: 100%; height: calc(100% - 52px);
      cursor: grab;
    }
    #map-canvas:active { cursor: grabbing; }

    /* Legend */
    .legend {
      position: absolute; bottom: 16px; left: 16px; z-index: 20;
      background: rgba(13,15,20,0.9); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 14px; display: flex; flex-direction: column; gap: 5px;
    }
    .leg-title { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 2px; }
    .leg-row { display: flex; align-items: center; gap: 7px; font-size: 0.7rem; color: var(--text-muted); }
    .leg-line { width: 18px; height: 3px; border-radius: 2px; flex-shrink: 0; background: #555; }
    .leg-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: rgba(255,255,255,0.4); }
    .leg-train       { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; background: var(--tfl-red); flex-shrink: 0; }
    .leg-train-est   { width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); background: #9E579D; flex-shrink: 0; opacity: .8; }

    /* Line toggles */
    .toggles {
      position: absolute; bottom: 16px; right: 16px; z-index: 20;
      background: rgba(13,15,20,0.9); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 14px; display: flex; flex-direction: column; gap: 4px;
      max-height: calc(100vh - 90px); overflow-y: auto;
    }
    .toggles::-webkit-scrollbar { width: 3px; }
    .toggles::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .tog-title { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 2px; }
    .tog-row {
      display: flex; align-items: center; gap: 7px; font-size: 0.72rem;
      cursor: pointer; padding: 2px 0; user-select: none;
      transition: opacity .15s; color: var(--text-muted);
    }
    .tog-row:hover { color: var(--text-primary); }
    .tog-row.off { opacity: 0.3; }
    .tog-pip { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* Tooltip */
    #tooltip {
      position: absolute; z-index: 30; pointer-events: none;
      background: rgba(13,15,20,0.96); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 0.78rem; display: none; max-width: 240px;
    }
    #tooltip strong { display: block; color: var(--text-primary); margin-bottom: 2px; }
    #tooltip .tt-sub { color: var(--text-muted); font-size: 0.7rem; }
    #tooltip .tt-est { color: #9E579D; font-size: 0.68rem; margin-top: 3px; font-style: italic; }

    /* Loading */
    #loading {
      position: absolute; inset: 52px 0 0 0; z-index: 25;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: var(--bg);
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--tfl-red); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-msg { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="header">
  <div class="roundel"><div class="roundel-bar"></div><div class="roundel-ring"></div></div>
  <div class="htext"><h1>Live Train Map</h1><p>Real-time positions · London</p></div>
  <div class="spacer"></div>
  <span id="status-text">Loading…</span>
  <a href="../arrivals/" class="back-link">← Arrivals</a>
</div>

<canvas id="map-canvas"></canvas>

<div id="loading">
  <div class="spinner"></div>
  <p id="loading-msg">Fetching line routes…</p>
</div>

<div id="tooltip"></div>

<div class="legend">
  <div class="leg-title">Legend</div>
  <div class="leg-row"><div class="leg-line"></div>Line route</div>
  <div class="leg-row"><div class="leg-dot"></div>Station</div>
  <div class="leg-row"><div class="leg-train"></div>Train (live position)</div>
  <div class="leg-row"><div class="leg-train-est"></div>Train (estimated)</div>
</div>

<div class="toggles" id="line-toggles">
  <div class="tog-title">Show / hide</div>
</div>

<script src="map_app.js"></script>
</body>
</html>
